# C1: push a tag vX.Y.Z -> GitHub Release with the flat file set of SPEC §4.
# Or Actions -> release -> Run workflow with a version: tags the commit it runs on (main).
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, vX.Y.Z (tags the selected branch head)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: only vX.Y.Z tags
        id: tag
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::$TAG is not vX.Y.Z, nothing to release"; fi
      - if: steps.tag.outputs.ok
        uses: actions/checkout@v4
      - if: steps.tag.outputs.ok
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.tag.outputs.ok
        run: npm ci
      - if: steps.tag.outputs.ok
        run: npm run typecheck
      - if: steps.tag.outputs.ok
        run: npm run fetch-model && npm run fetch-model:coco-dev && npm run fetch-model:shelf
      - if: steps.tag.outputs.ok
        run: npm test
      - if: steps.tag.outputs.ok
        run: npm run build
      # v0.1.x = 110-class model only; v0.2.x = 1-class shelf model only; v0.3.x+ = combined (both models).
      - if: steps.tag.outputs.ok
        run: |
          if [[ "$TAG" == v0.1.* ]]; then
            npm run package -- --version "$TAG" --model-dir models
          elif [[ "$TAG" == v0.2.* ]]; then
            npm run package -- --version "$TAG" --model-dir models/shelf
          else
            npm run package -- --version "$TAG" --model-dir models --shelf-model-dir models/shelf
          fi
      - if: steps.tag.outputs.ok
        name: verify
        run: cd "release/$TAG" && sha256sum -c SHA256SUMS
      - if: steps.tag.outputs.ok
        name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/"$TAG"/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "shelf-agent $TAG (contract shelf-agent-js/1). Model: $(jq -r '.model | "\(.name), \(.dataset), \(.classes) classes, sha256 \(.sha256)"' release/"$TAG"/manifest.json). Verify: sha256sum -c SHA256SUMS"
